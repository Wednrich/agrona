[project]
name = "agrona"
version = "0.1.0"
# Keep Vercel's build installer and function runtime on the wheel's Python ABI.
requires-python = "~=3.12.0"
# Keep in sync with requirements.txt, which also supports local pip installs.
dependencies = [
    "requests>=2.32,<3",
    "numpy>=2,<3",
    "rasterio==1.4.3; python_version < '3.14'",
    "rasterio==1.4.4; python_version >= '3.14'",
    "shapely>=2,<3",
]
